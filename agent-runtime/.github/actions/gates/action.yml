name: Gates
description: >-
  Builds the dev image of one tree and runs its docs gate, seccomp checks and quality gates, then
  builds its prod image and scans its libraries. Last, even after a failure, it checks the tree's
  third-party notices. The check job runs it on the checkout, and the public-tree job on the
  exported public tree.

inputs:
  tree:
    description: The folder that holds the tree, relative to the workspace.
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Build dev image
      shell: bash
      working-directory: ${{ inputs.tree }}
      run: docker build --target dev -t agent-runtime:dev .

    - name: Docs gate (frontmatter schema, internal links, source paths)
      shell: bash
      working-directory: ${{ inputs.tree }}
      run: ./scripts/check-docs.sh

    - name: Seccomp profile matches its transform
      shell: bash
      working-directory: ${{ inputs.tree }}
      run: |
        docker run --rm -v "$PWD/sandbox:/sandbox:ro" agent-runtime:dev \
          sh -c 'jq -f /sandbox/make-custom-profile.jq /sandbox/docker-default-seccomp.json | diff - /sandbox/seccomp-bwrap.json'

    - name: Permit unprivileged user namespaces on the runner
      shell: bash
      working-directory: ${{ inputs.tree }}
      run: ./scripts/ci-permit-userns.sh

    - name: Seccomp matrix on native x86_64
      shell: bash
      working-directory: ${{ inputs.tree }}
      run: ./scripts/seccomp-matrix.sh agent-runtime:dev

    - name: The supervisor cannot become uid 0 under the profile
      shell: bash
      working-directory: ${{ inputs.tree }}
      run: ./scripts/seccomp-uid-matrix.sh agent-runtime:dev

    - name: Quality gates (typecheck, lint, test)
      shell: bash
      working-directory: ${{ inputs.tree }}
      run: |
        docker run --rm \
          -e GITHUB_ACTIONS=true \
          --security-opt seccomp="$PWD/sandbox/seccomp-bwrap.json" \
          --security-opt systempaths=unconfined \
          --security-opt apparmor=unconfined \
          --security-opt no-new-privileges \
          agent-runtime:dev bun run check

    - name: Build prod image
      shell: bash
      working-directory: ${{ inputs.tree }}
      run: docker build --target prod -t agent-runtime:prod .

    - name: Library scan (fixable medium-or-worse vulnerabilities in the app's npm tree and the toolbelt's Python and npm trees)
      shell: bash
      working-directory: ${{ inputs.tree }}
      run: ./scripts/scan-libraries.sh agent-runtime:prod

    # The maintainers' copy resolves the same packages as its export, so the check runs once there,
    # on the export, and the registry lookups are not made twice.
    - name: Third-party notices list every package, each under an allowed licence
      if: ${{ !cancelled() && (inputs.tree != '.' || !github.event.repository.private) }}
      shell: bash
      working-directory: ${{ inputs.tree }}
      run: |
        python3 -m unittest discover -s scripts/notices -p "test_*.py"
        python3 scripts/notices/notices.py check

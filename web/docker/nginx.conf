server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Security headers. A location that sets its own add_header drops all of these, so none does.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Scripts run only from this origin and from Google's sign-in library, so text that slips past
    # the app's sanitising cannot run. Google sign-in also needs its frames and stylesheet. The app
    # connects to an OIDC issuer that each deployment names in its API settings, so connections may
    # go to any HTTPS origin. Previews and downloads open blob URLs.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: blob:; font-src 'self' data:; connect-src CSP_CONNECT_SRC_PLACEHOLDER; frame-src 'self' blob: https://accounts.google.com/gsi/; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    # Allow large file uploads (documents) through the proxy
    client_max_body_size 100m;

    # nginx resolves a literal proxy_pass host once, at start, but a recreated api container
    # gets a new address. A target held in a variable is resolved per request through the
    # container's own DNS server, which 40-proxy-backend.sh writes in.
    resolver RESOLVER_PLACEHOLDER valid=5s;
    set $api_backend PROXY_BACKEND_URL_PLACEHOLDER;

    # Explicit health endpoint (Dockerfile HEALTHCHECK targets this)
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Reverse proxy: API requests
    location /api/ {
        proxy_pass $api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
}
